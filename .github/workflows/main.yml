name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper On-The-Fly
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -q
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with DSP and App
        run: ./gradlew :app:assembleDebug

      - name: Publish APK to dev-build release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-build --repo ${{ github.repository }} >/dev/null 2>&1 || gh release create dev-build --repo ${{ github.repository }} --title "Latest dev build" --notes "Rolling dev build APK, updated on every green build."
          gh release upload dev-build --repo ${{ github.repository }} --clobber app/build/outputs/apk/debug/app-debug.apk
