name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: ./DeanWave-Music

      - name: Grant execute permission for gradlew
        working-directory: ./DeanWave-Music
        run: chmod +x gradlew

      - name: Build Debug APK with DSP and App
        working-directory: ./DeanWave-Music
        run: ./gradlew :app:assembleDebug
        
